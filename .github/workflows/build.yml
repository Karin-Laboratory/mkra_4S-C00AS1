name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the ARM target
        run: rustup target add armv7-unknown-linux-musleabihf

      - name: Test (host)
        run: cargo test --locked

      - name: Build for the device
        run: ./build-device.sh --locked

      # A dynamically linked binary would need libraries the box does not have,
      # so fail the build rather than publish one that cannot start.
      - name: Verify the binary is static
        run: |
          BIN=target/armv7-unknown-linux-musleabihf/release/mkra
          file "$BIN"
          file "$BIN" | grep -q "statically linked"
          readelf -d "$BIN" | grep -i needed && exit 1
          sha256sum "$BIN" | tee mkra.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: mkra-armv7
          path: |
            target/armv7-unknown-linux-musleabihf/release/mkra
            mkra.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/armv7-unknown-linux-musleabihf/release/mkra
            mkra.sha256
