name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/epgstation/package-lock.json
      - name: Install ARM target
        run: rustup target add armv7-unknown-linux-musleabihf
      - name: Audit all tracked files and reachable history
        run: |
          git fetch --unshallow || test "$(git rev-parse --is-shallow-repository)" = false
          python3 tools/audit_publication.py
      - name: Check documentation and systemd distribution templates
        run: |
          python3 tools/check_docs.py
          python3 -m compileall -q tools
          mkdir -p target
          cp tools/epgstation/epgstation.service.example target/epgstation.service
          systemd-analyze verify --man=no tools/epgstation/bs4k-epg-proxy.service tools/epgstation/bs4k-epg-scan.service tools/epgstation/bs4k-epg-scan.timer tools/epgstation/bs2k-epg-scan.service tools/epgstation/bs2k-epg-scan.timer target/epgstation.service
      - name: Rust tests and static ARM build
        run: ./tools/build_unified.sh
      - name: Check host CLI without accessing hardware
        run: |
          cargo build --locked
          target/debug/mkra --help > target/help.txt
          grep -q -- --bs2k target/help.txt
          grep -q -- --isdbs-channels target/help.txt
      - name: Watcher and bundle tests
        run: |
          python3 -m unittest discover -s tools/mkra-watch -p 'test_*.py'
          python3 tools/mkra-watch/watch.py --self-test
          python3 tools/mkra-watch/make_bundle.py --output dist/mkra-watch
          python3 -c 'import sys; sys.path.insert(0, "dist/mkra-watch"); import watch; watch.verify_bundle()'
      - name: EIT and HTTP tests (synthetic input only)
        run: |
          npm ci --ignore-scripts --prefix tools/epgstation
          npm test --prefix tools/epgstation
      - name: Verify ARM binary and checksums
        run: |
          BIN=target/armv7-unknown-linux-musleabihf/release/mkra
          file "$BIN"
          file "$BIN" | grep -q 'ARM.*statically linked'
          if readelf -d "$BIN" | grep -i needed; then exit 1; fi
          (cd target/armv7-unknown-linux-musleabihf/release && sha256sum mkra) | tee mkra.sha256
      - name: Package binary, configuration and license notices
        run: |
          mkdir -p dist/mkra-armv7
          cp target/armv7-unknown-linux-musleabihf/release/mkra dist/mkra-armv7/
          cp LICENSE docs/RELEASE.ja.md config/bs-additional-main.tsv dist/mkra-armv7/
          cp tools/third-party/libarib25-LICENSE tools/third-party/libarib25-NOTICE.md dist/mkra-armv7/
          tar -czf mkra-armv7.tar.gz -C dist mkra-armv7
          sha256sum mkra-armv7.tar.gz > mkra-armv7.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: mkra-armv7
          path: |
            target/armv7-unknown-linux-musleabihf/release/mkra
            mkra.sha256
            mkra-armv7.tar.gz
            mkra-armv7.tar.gz.sha256
            LICENSE
            tools/third-party/libarib25-LICENSE
            tools/third-party/libarib25-NOTICE.md
      - name: Publish experimental release on version tag
        if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'Karin-Laboratory/mkra_4S-C00AS1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
            --title "mkra BS2K/BS4K $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE.ja.md \
            target/armv7-unknown-linux-musleabihf/release/mkra mkra.sha256 \
            mkra-armv7.tar.gz mkra-armv7.tar.gz.sha256 LICENSE \
            tools/third-party/libarib25-LICENSE tools/third-party/libarib25-NOTICE.md
